<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股息流 · 股息自由游戏</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 背景音乐控件：开始界面与顶栏共用，状态由 js/bgm.js 统一同步 */
  .bgm-row{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
  .bgm-vol{width:96px;accent-color:#3ddc97;cursor:pointer;vertical-align:middle}
  .bgm-toggle.off{opacity:.55}
  #topbar .bgm-vol{width:74px}
  /* 联机浮层：与 #modal 相同的全屏遮罩定位（z-index 更高，保证盖在最上层）
     注：.hidden 是 display:none!important，优先级高于 ID 选择器，隐藏照常生效 */
  #auth-overlay,#lobby-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:90;
    display:flex;align-items:center;justify-content:center;padding:20px}
  /* 联机：登录框与大厅 */
  .ol-input{display:block;width:100%;margin:8px 0;padding:9px 12px;border-radius:8px;
    border:1px solid #3a4a63;background:#131c2b;color:#e8eef7;font-size:14px;box-sizing:border-box}
  .ol-select{background:#131c2b;color:#e8eef7;border:1px solid #3a4a63;border-radius:8px;
    padding:8px 10px;font-size:13px;cursor:pointer;margin-right:auto;max-width:150px}
  .ol-msg{min-height:20px;font-size:13px;color:#ffb4b4;margin:4px 0}
  .ol-msg.ok{color:#3ddc97}
  .ol-hint{font-size:12px;color:#8fa3c6;line-height:1.6;margin:2px 0 6px}
  .ol-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
  .ol-seats{list-style:none;padding:0;margin:8px 0;max-height:150px;overflow:auto}
  .ol-seats li{padding:6px 10px;border-radius:6px;background:#1b2637;margin-bottom:4px;font-size:14px}
  .ol-row{margin:6px 0;font-size:14px}
</style>
</head>
<body>

<!-- ========== 开始界面 ========== -->
<section id="screen-setup" class="screen">
  <div class="setup-inner">
    <div class="logo-wrap">
      <div class="logo-badge">📈</div>
      <h1><span data-i18n="brand">股息流</span><span data-i18n="brand_sub">红利投资模拟</span></h1>
      <p class="sub" data-i18n="slogan">买红利股吃股息，让被动收入超过支出，实现财务自由！</p>
    </div>

    <div class="panel setup-panel">
      <h2 data-i18n="sec_count">1. 游戏人数</h2>
      <div class="count-row">
        <button id="dec-count" class="btn circle">−</button>
        <div id="count-num" class="count-num">2</div>
        <button id="inc-count" class="btn circle">+</button>
        <span class="hint" data-i18n="hint_count">最多 4 家 · 名字已随机填好，点一下即可改成自己的 · 每位可设为真人或电脑 AI</span>
      </div>

      <h2 data-i18n="sec_players">2. 玩家与职业</h2>
      <div id="player-cfg"></div>

      <!-- 工具行（🎲 全员随机职业 · 📖 玩法说明演示 · 提示语）由 addSetupTools 注入到 #start-row 之前 -->
      <!-- 三分区布局：左＝新手教学演示，中＝开始游戏（居中），右＝退出游戏 -->
      <!-- 背景音乐：开关 + 音量（与顶栏共用同一状态，由 js/bgm.js 同步） -->
      <div class="bgm-row">
        <button class="btn sm ghost bgm-toggle" type="button" title="开关背景音乐">🎵 音乐</button>
        <input type="range" class="bgm-vol" min="0" max="100" step="1" value="50" title="背景音乐音量">
        <span class="hint" data-i18n="bgm_hint">背景音乐：开始界面与对局中各一首</span>
      </div>
      <div class="start-row" id="start-row">
        <div class="start-left">
          <button id="btn-guide" class="btn big guide-btn" type="button" data-i18n="btn_guide">🎓 新手教学演示</button>
          <button id="btn-online" class="btn big guide-btn" type="button" title="联机对战（需服务端）">🌐 联机对战</button>
        </div>
        <button id="btn-start" class="btn primary big" data-i18n="btn_start">开始游戏</button>
        <div class="start-right">
          <button id="btn-exit" class="btn big guide-btn" type="button" data-i18n="btn_exit">退出游戏</button>
        </div>
      </div>
    </div>

    <details class="rules">
      <summary data-i18n="rules_summary">游戏规则速览</summary>
      <ul id="rules-list"></ul>
      <div class="legend-title">🧭 棋盘图例（每格含义）</div>
      <ul id="legend-list"></ul>
    </details>
    <!-- 本机跨局战绩（有记录时由 renderStats 显示） -->
    <section id="stats-panel" class="panel stats-panel hidden">
      <h2 data-i18n="stats_title">🏅 本机战绩</h2>
      <div id="stats-body"></div>
    </section>

  </div>
</section>

<!-- ========== 游戏界面 ========== -->
<section id="screen-game" class="screen hidden">
  <header id="topbar">
    <div class="brand"><span data-i18n="brand">股息流</span><span data-i18n="brand_sub">红利投资模拟</span></div>
    <div id="top-status">准备中…</div>
    <div class="top-actions">
      <button id="btn-guide-top" class="btn ghost sm" type="button">📖 玩法</button>
      <button id="btn-log" class="btn ghost sm" type="button">📜 日志</button>
      <button class="btn ghost sm bgm-toggle" type="button" title="开关背景音乐">🎵 音乐</button>
      <input type="range" class="bgm-vol" min="0" max="100" step="1" value="50" title="背景音乐音量">
      <button id="btn-quit" class="btn ghost sm" type="button">退出</button>
    </div>
  </header>

  <!-- 顶部：实时行情 -->
  <section id="marketbar">
    <div id="ticker"></div>
  </section>

  <!-- 出局观战提示（有人破产淘汰后持久显示） -->
  <div id="elimbar" class="hidden"></div>

  <main id="layout">
    <!-- 左栏：财务自由进度 + 持仓 + 还债（跟随当前 / 正在查看的玩家） -->
    <aside id="col-left">
      <div id="panel"></div>
    </aside>

    <!-- 中栏：轮盘 -->
    <aside id="col-board">
      <div id="board-head">
        <h3>🐹 仓鼠圈</h3>
        <div id="dice-box"><span class="die" id="die1">·</span><span class="die" id="die2" style="display:none">·</span></div>
        <button id="btn-roll" class="btn primary big roll-btn hidden">🎲 掷骰子</button>
      </div>
      <div id="board"></div>
    </aside>

    <!-- 右栏：月收支表 + 资产负债表 -->
    <section id="col-right">
      <div id="sheet"></div>
    </section>
  </main>

  <!-- 底部：各玩家资产情况 -->
  <section id="summaries"></section>
</section>

<!-- ========== 弹窗 ========== -->
<div id="modal" class="hidden">
  <div class="mback"><div class="mcard" id="mbody"></div></div>
</div>

<!-- ========== 联机：登录 / 注册 ========== -->
<div id="auth-overlay" class="hidden">
  <div class="mback"><div class="mcard" style="max-width:380px">
    <h3 id="auth-title">🌐 联机登录</h3>
    <input id="auth-user" class="ol-input" type="text" placeholder="用户名（最长 16 字）" autocomplete="off">
    <input id="auth-email" class="ol-input hidden" type="email" placeholder="邮箱（用于找回密码）" autocomplete="off">
    <input id="auth-pass" class="ol-input" type="password" placeholder="密码（至少 4 位）">
    <input id="auth-pass2" class="ol-input hidden" type="password" placeholder="确认密码">
    <div id="auth-msg" class="ol-msg"></div>
    <div id="auth-hint" class="ol-hint hidden"></div>
    <div class="ol-btns">
      <button id="auth-submit" class="btn primary" type="button">登录</button>
      <button id="auth-switch" class="btn" type="button">去注册</button>
      <button id="auth-forgot" class="btn ghost" type="button">忘记密码</button>
      <button id="auth-close" class="btn ghost" type="button">关闭</button>
    </div>
  </div></div>
</div>

<!-- ========== 联机：大厅 ========== -->
<div id="lobby-overlay" class="hidden">
  <div class="mback"><div class="mcard" style="max-width:420px">
    <h3>🏠 联机大厅</h3>
    <div class="ol-row">房间号：<b id="lobby-roomno">—</b></div>
    <ul id="lobby-seats" class="ol-seats"></ul>
    <input id="lobby-roomid" class="ol-input" type="text" placeholder="输入房间号加入" autocomplete="off">
    <div id="lobby-msg" class="ol-msg"></div>
    <div class="ol-btns">
      <select id="lobby-prof" class="ol-select" title="选择职业（选“随机”则开局时自动分配）"></select>
      <button id="lobby-create" class="btn" type="button">建房</button>
      <button id="lobby-join" class="btn" type="button">加入</button>
      <button id="lobby-start" class="btn primary" type="button" disabled>开局</button>
      <button id="lobby-close" class="btn ghost" type="button">离开</button>
    </div>
  </div></div>
</div>

<div id="toast"></div>

<!-- 事件日志（常驻节点：内容随每次渲染实时刷新，打开即最新） -->
<div id="logpanel" class="hidden">
  <div class="lp-head"><span>📜 事件日志</span><button class="btn ghost sm" id="btn-log-close" type="button">✕</button></div>
  <div id="log-list"></div>
</div>

<!-- 破产保护：强制变卖逐笔回放 -->
<div id="liqbox" class="hidden"></div>

<!-- 新手教学：AI 边玩边讲的解说条（层级高于弹窗，保证讲解始终可见） -->
<div id="coachbox" class="hidden"></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/bgm.js"></script>
<script src="js/sfx.js"></script>
<script src="js/render.js"></script>
<script src="js/online.js"></script>
</body>
</html>
