<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>股息流 · 重置密码</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 800px at 50% -10%,#16233c,#0a1120 60%,#070d18);
    color:#e8eef7;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  .box{width:min(420px,92vw);background:linear-gradient(180deg,#17233f,#101a33);
    border:1px solid #34508a;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.6);padding:26px}
  h1{margin:0 0 6px;font-size:20px}
  p{color:#9fb0d0;font-size:13px;margin:0 0 16px;line-height:1.7}
  input{display:block;width:100%;margin:10px 0;padding:11px 13px;border-radius:10px;
    border:1px solid #3a4a63;background:#131c2b;color:#e8eef7;font-size:14px;outline:none}
  input:focus{border-color:#3ddc97}
  button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,#3ddc97,#22b47a);color:#062015;font-weight:800;font-size:15px}
  button:disabled{opacity:.5;cursor:not-allowed}
  #msg{min-height:22px;margin-top:12px;font-size:13px}
  #msg.err{color:#ff9b9b}
  #msg.ok{color:#3ddc97}
  a{display:inline-block;margin-top:10px;color:#8ab4ff;font-size:13px;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <h1>🔑 重置密码</h1>
    <p id="tip">请设置新密码（至少 4 位）。链接 30 分钟内有效，且只能使用一次。</p>
    <input id="p1" type="password" placeholder="新密码（至少 4 位）">
    <input id="p2" type="password" placeholder="确认新密码">
    <button id="go">确认重置</button>
    <div id="msg"></div>
    <a href="/">返回游戏</a>
    <p style="margin-top:14px;font-size:12px;color:#7f93b8;line-height:1.7">
      链接失效或没收到邮件？回首页点「🌐 联机对战 → 忘记密码」，用注册时设置的<b>密保问题</b>直接重置，无需邮件。
    </p>
  </div>
<script>
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg');
  var tip = document.getElementById('tip');
  var go = document.getElementById('go');

  if (!token) { tip.textContent = '链接无效：缺少 token，请重新申请找回密码。'; go.disabled = true; }

  go.onclick = async function () {
    var p1 = document.getElementById('p1').value;
    var p2 = document.getElementById('p2').value;
    if (p1.length < 4) { msg.className = 'err'; msg.textContent = '密码至少 4 位'; return; }
    if (p1 !== p2) { msg.className = 'err'; msg.textContent = '两次输入的密码不一致'; return; }
    go.disabled = true;
    msg.className = ''; msg.textContent = '提交中…';
    try {
      var r = await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: p1 })
      });
      var j = await r.json();
      if (j.err) { msg.className = 'err'; msg.textContent = j.err; go.disabled = false; return; }
      msg.className = 'ok'; msg.textContent = '✅ 密码已重置，正在跳转登录…';
      setTimeout(function () { location.href = '/'; }, 1200);
    } catch (e) {
      msg.className = 'err'; msg.textContent = '网络错误，请稍后重试'; go.disabled = false;
    }
  };
</script>
</body>
</html>
